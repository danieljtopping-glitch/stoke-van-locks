<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Form Registration</title>
</head>
<body>
  <!-- 
    This dummy form exists purely so Netlify's build bots 
    can detect and register the 'quote-request' form correctly.
  -->
  <form name="quote-request" data-netlify="true" netlify-honeypot="bot-field" action="/thank-you/" method="POST">
    <input type="text" name="full-name" />
    <input type="tel" name="phone" />
    <input type="email" name="email" />
    <input type="text" name="postcode" />
    <input type="text" name="van-make" />
    <input type="text" name="van-model" />
    <input type="text" name="van-year" />
    <input type="text" name="doors" />
    <select name="lock-type"></select>
    <textarea name="notes"></textarea>
    <input type="checkbox" name="request-callback" />
    <select name="preferred-time"></select>
  </form>
</body>
</html>
